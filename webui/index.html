<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightLLM - 本地大模型管理</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo span {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }
        
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
        }
        
        .tab:hover {
            background: var(--bg-hover);
            color: var(--text);
        }
        
        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .tab-icon { margin-right: 0.5rem; }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            font-size: 0.95rem;
        }
        
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
        }
        
        select {
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
        }
        
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        
        .model-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            transition: all 0.2s;
        }
        
        .model-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }
        
        .model-name {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .model-source {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            background: var(--bg-hover);
            color: var(--text-muted);
        }
        
        .model-source.hf { background: #fbbf24; color: #000; }
        .model-source.ms { background: #ef4444; color: #fff; }
        .model-source.civitai { background: #f97316; color: #fff; }
        .model-source.ollama { background: #06b6d4; color: #fff; }
        .model-source.pixart { background: #ec4899; color: #fff; }
        .model-source.local { background: var(--bg-hover); color: var(--text-muted); }
        
        .model-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        
        .model-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        
        .model-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .model-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            background: var(--bg-hover);
            border-radius: 0.25rem;
            color: var(--text-muted);
        }
        
        .btn {
            padding: 0.6rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        
        .btn-outline:hover {
            background: var(--bg-hover);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-group {
            display: flex;
            gap: 0.5rem;
        }
        
        /* 转换工具样式 */
        .converter-form {
            display: grid;
            gap: 1rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .form-group input,
        .form-group select {
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
        }
        
        .conversion-paths {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.75rem;
            margin: 1rem 0;
        }
        
        .conversion-path {
            padding: 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .conversion-path:hover {
            border-color: var(--primary);
        }
        
        .conversion-path .arrow {
            color: var(--primary);
            font-weight: bold;
        }
        
        /* 进度条 */
        .progress-container {
            margin-top: 1rem;
            display: none;
        }
        
        .progress-container.active {
            display: block;
        }
        
        .progress-bar {
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #a855f7);
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
        
        /* Toast 通知 */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        
        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }
        
        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }
        
        /* 隐藏 */
        .hidden { display: none !important; }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>⚡ LightLLM</h1>
                <span>v2.0</span>
            </div>
            <div>
                <button class="btn btn-outline" onclick="refreshData()">🔄 刷新</button>
                <button class="btn btn-primary" onclick="openSettings()">⚙️ 设置</button>
            </div>
        </header>
        
        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat">
                <div class="stat-label">系统内存</div>
                <div class="stat-value" id="stat-memory">--</div>
            </div>
            <div class="stat">
                <div class="stat-label">已安装模型</div>
                <div class="stat-value" id="stat-installed">--</div>
            </div>
            <div class="stat">
                <div class="stat-label">可用模型</div>
                <div class="stat-value" id="stat-available">--</div>
            </div>
            <div class="stat">
                <div class="stat-label">模型目录</div>
                <div class="stat-value" id="stat-path">--</div>
            </div>
        </div>
        
        <!-- 标签页 -->
        <div class="tabs">
            <div class="tab active" data-tab="models">
                <span class="tab-icon">📦</span>模型商店
            </div>
            <div class="tab" data-tab="installed">
                <span class="tab-icon">💾</span>已安装
            </div>
            <div class="tab" data-tab="converter">
                <span class="tab-icon">🔄</span>格式转换
            </div>
            <div class="tab" data-tab="deploy">
                <span class="tab-icon">🚀</span>部署服务
            </div>
        </div>
        
        <!-- 模型商店 -->
        <div id="tab-models" class="tab-content">
            <div class="card">
                <div class="card-title">📦 模型商店</div>
                
                <div class="filters">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="搜索模型..." oninput="filterModels()">
                    </div>
                    <select id="source-filter" onchange="filterModels()">
                        <option value="">全部来源</option>
                        <option value="huggingface">🤗 HuggingFace</option>
                        <option value="modelscope">📦 ModelScope</option>
                        <option value="civitai">🎨 Civitai</option>
                        <option value="ollama">🦙 Ollama</option>
                        <option value="pixart">🖼️ Pixart</option>
                    </select>
                    <select id="type-filter" onchange="filterModels()">
                        <option value="">全部类型</option>
                        <option value="llm">🤖 语言模型</option>
                        <option value="image">🎨 图像模型</option>
                    </select>
                </div>
                
                <div class="models-grid" id="models-grid">
                    <!-- 模型卡片动态生成 -->
                </div>
            </div>
        </div>
        
        <!-- 已安装模型 -->
        <div id="tab-installed" class="tab-content hidden">
            <div class="card">
                <div class="card-title">💾 已安装的模型</div>
                <div id="installed-list">
                    <p style="color: var(--text-muted);">正在加载...</p>
                </div>
            </div>
        </div>
        
        <!-- 格式转换 -->
        <div id="tab-converter" class="tab-content hidden">
            <div class="card">
                <div class="card-title">🔄 模型格式转换工具</div>
                
                <div class="conversion-paths">
                    <div class="conversion-path" onclick="selectConversion('safetensors', 'gguf')">
                        <strong>🤗 HF</strong> → <strong>📦 GGUF</strong>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">HuggingFace 转 llama.cpp</div>
                    </div>
                    <div class="conversion-path" onclick="selectConversion('gguf', 'gguf')">
                        <strong>📦 GGUF</strong> → <strong>📦 GGUF</strong>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">量化压缩</div>
                    </div>
                    <div class="conversion-path" onclick="selectConversion('safetensors', 'onnx')">
                        <strong>🤗 HF</strong> → <strong>🔷 ONNX</strong>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">通用格式转换</div>
                    </div>
                    <div class="conversion-path" onclick="selectConversion('safetensors', 'mlx')">
                        <strong>🤗 HF</strong> → <strong>🍎 MLX</strong>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Apple Silicon 优化</div>
                    </div>
                </div>
                
                <div class="converter-form">
                    <div class="form-group">
                        <label>输入文件/目录</label>
                        <input type="text" id="conv-input" placeholder="选择或输入模型路径">
                    </div>
                    <div class="form-group">
                        <label>输出路径</label>
                        <input type="text" id="conv-output" placeholder="留空自动生成">
                    </div>
                    <div class="form-group">
                        <label>量化等级 (仅 GGUF)</label>
                        <select id="conv-quantile">
                            <option value="">不量化</option>
                            <option value="Q2_K">Q2_K - 最高压缩</option>
                            <option value="Q3_K_M">Q3_K_M - 高压缩</option>
                            <option value="Q4_K_M" selected>Q4_K_M - 平衡 (推荐)</option>
                            <option value="Q5_0">Q5_0 - 高质量</option>
                            <option value="Q5_K_M">Q5_K_M - 高质量压缩</option>
                            <option value="Q6_K">Q6_K - 接近原生</option>
                            <option value="Q8_0">Q8_0 - 几乎无损</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-primary" onclick="startConversion()">
                        🚀 开始转换
                    </button>
                    
                    <div class="progress-container" id="conv-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="conv-progress-fill"></div>
                        </div>
                        <div class="progress-text">
                            <span id="conv-status">准备中...</span>
                            <span id="conv-percent">0%</span>
                        </div>
                    </div>
                </div>
                
                <div style="margin-top: 2rem;">
                    <button class="btn btn-outline" onclick="showQuantizationGuide()">
                        📊 量化等级说明
                    </button>
                    <button class="btn btn-outline" onclick="installLlamaCpp()">
                        🔧 安装 llama.cpp
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 部署服务 -->
        <div id="tab-deploy" class="tab-content hidden">
            <div class="card">
                <div class="card-title">🚀 部署 LLM 服务</div>
                
                <div class="converter-form">
                    <div class="form-group">
                        <label>选择模型</label>
                        <select id="deploy-model">
                            <option value="">-- 选择已安装的模型 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>端口 (默认 8080)</label>
                        <input type="number" id="deploy-port" value="8080">
                    </div>
                    <div class="form-group">
                        <label>上下文长度</label>
                        <select id="deploy-context">
                            <option value="2048">2048</option>
                            <option value="4096" selected>4096</option>
                            <option value="8192">8192</option>
                            <option value="16384">16384</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>线程数</label>
                        <input type="number" id="deploy-threads" value="4">
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="startServer()">
                            ▶️ 启动服务
                        </button>
                        <button class="btn btn-danger" onclick="stopServer()">
                            ⏹️ 停止服务
                        </button>
                    </div>
                    
                    <div class="progress-container" id="server-status">
                        <div class="progress-bar">
                            <div class="progress-fill" id="server-progress-fill" style="width: 100%; background: var(--success);"></div>
                        </div>
                        <div class="progress-text">
                            <span id="server-status-text">服务已停止</span>
                            <span id="server-url"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast"></div>
    
    <!-- 模态框 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">提示</div>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        let allModels = [];
        let installedModels = [];
        let serverRunning = false;
        
        const API_BASE = 'http://localhost:8081/api';
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initTabs();
            refreshData();
        });
        
        // 标签页切换
        function initTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                    tab.classList.add('active');
                    document.getElementById(`tab-${tab.dataset.tab}`).classList.remove('hidden');
                    
                    if (tab.dataset.tab === 'installed') loadInstalledModels();
                    if (tab.dataset.tab === 'deploy') loadDeployOptions();
                });
            });
        }
        
        // 刷新数据
        async function refreshData() {
            try {
                const [statsRes, modelsRes, sysRes] = await Promise.all([
                    fetch(`${API_BASE}/stats`),
                    fetch(`${API_BASE}/models`),
                    fetch(`${API_BASE}/system`)
                ]);
                
                const stats = await statsRes.json();
                const models = await modelsRes.json();
                const sys = await sysRes.json();
                
                document.getElementById('stat-memory').textContent = `${sys.memory_available_gb} / ${sys.memory_total_gb} GB`;
                document.getElementById('stat-installed').textContent = stats.installed_count;
                document.getElementById('stat-available').textContent = models.length;
                document.getElementById('stat-path').textContent = stats.model_dir;
                
                allModels = models;
                renderModels(models);
                
            } catch (e) {
                console.error('获取数据失败:', e);
                showToast('获取数据失败，请确保服务已启动', 'error');
            }
        }
        
        // 渲染模型列表
        function renderModels(models) {
            const grid = document.getElementById('models-grid');
            grid.innerHTML = models.map(m => `
                <div class="model-card" data-id="${m.id}" data-source="${m.source_name}" data-type="${m.image_model ? 'image' : 'llm'}">
                    <div class="model-header">
                        <span class="model-name">${m.name}</span>
                        <span class="model-source ${m.source_name}">${getSourceName(m.source_name)}</span>
                    </div>
                    <div class="model-desc">${m.description || '暂无描述'}</div>
                    <div class="model-meta">
                        <span>📏 ${m.size_gb} GB</span>
                        <span>💾 ${Math.ceil(m.min_memory_mb/1024)}GB+ 内存</span>
                    </div>
                    <div class="model-tags">
                        ${(m.tags || []).slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="installModel('${m.id}')" ${m.source === 'local' ? 'disabled' : ''}>
                            ⬇️ 安装
                        </button>
                        <button class="btn btn-outline" onclick="showModelInfo('${m.id}')">ℹ️</button>
                    </div>
                </div>
            `).join('');
        }
        
        function getSourceName(source) {
            const names = {
                huggingface: 'HF',
                modelscope: 'MS',
                civitai: 'Civitai',
                ollama: 'Ollama',
                pixart: 'Pixart',
                local: '本地'
            };
            return names[source] || source;
        }
        
        // 筛选模型
        function filterModels() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const source = document.getElementById('source-filter').value;
            const type = document.getElementById('type-filter').value;
            
            const filtered = allModels.filter(m => {
                const matchSearch = !search || 
                    m.name.toLowerCase().includes(search) ||
                    m.description?.toLowerCase().includes(search);
                const matchSource = !source || m.source_name === source;
                const matchType = !type || 
                    (type === 'llm' && !m.image_model) ||
                    (type === 'image' && m.image_model);
                return matchSearch && matchSource && matchType;
            });
            
            renderModels(filtered);
        }
        
        // 安装模型
        async function installModel(modelId) {
            showToast(`正在安装 ${modelId}...`, 'info');
            
            try {
                const res = await fetch(`${API_BASE}/models/install`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model_id: modelId })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showToast(`✅ ${modelId} 安装成功！`, 'success');
                    refreshData();
                } else {
                    showToast(`❌ 安装失败: ${data.error}`, 'error');
                }
            } catch (e) {
                showToast('安装请求失败', 'error');
            }
        }
        
        // 加载已安装模型
        async function loadInstalledModels() {
            try {
                const res = await fetch(`${API_BASE}/models/installed`);
                const data = await res.json();
                installedModels = data.models || [];
                
                const list = document.getElementById('installed-list');
                if (installedModels.length === 0) {
                    list.innerHTML = '<p style="color: var(--text-muted);">暂无已安装的模型</p>';
                    return;
                }
                
                list.innerHTML = installedModels.map(m => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--bg); border-radius: 0.5rem; margin-bottom: 0.75rem;">
                        <div>
                            <div style="font-weight: 600;">${m.id}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">
                                ${(m.size_mb / 1024).toFixed(2)} GB | ${m.files} 个文件
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-danger" onclick="removeModel('${m.id}')">🗑️ 删除</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('加载已安装模型失败:', e);
            }
        }
        
        // 删除模型
        async function removeModel(modelId) {
            if (!confirm(`确定要删除模型 ${modelId} 吗？`)) return;
            
            try {
                const res = await fetch(`${API_BASE}/models/remove`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model_id: modelId })
                });
                
                const data = await res.json();
                showToast(data.success ? `✅ 删除成功` : `❌ 删除失败`, data.success ? 'success' : 'error');
                loadInstalledModels();
                refreshData();
            } catch (e) {
                showToast('删除请求失败', 'error');
            }
        }
        
        // 模型详情
        async function showModelInfo(modelId) {
            try {
                const res = await fetch(`${API_BASE}/models/info/${modelId}`);
                const m = await res.json();
                
                document.getElementById('modal-title').textContent = m.name;
                document.getElementById('modal-body').innerHTML = `
                    <div style="line-height: 2;">
                        <p><strong>ID:</strong> ${m.id}</p>
                        <p><strong>来源:</strong> ${m.source_name}</p>
                        <p><strong>大小:</strong> ${m.size_gb} GB</p>
                        <p><strong>最低内存:</strong> ${Math.ceil(m.min_memory_mb/1024)} GB</p>
                        <p><strong>推荐内存:</strong> ${Math.ceil(m.recommended_memory_mb/1024)} GB</p>
                        <p><strong>描述:</strong> ${m.description || '暂无'}</p>
                        <p><strong>标签:</strong> ${(m.tags || []).join(', ')}</p>
                    </div>
                `;
                document.getElementById('modal').classList.add('active');
            } catch (e) {
                showToast('获取模型信息失败', 'error');
            }
        }
        
        // 转换工具
        function selectConversion(from, to) {
            document.getElementById('conv-input').placeholder = `输入 ${from} 格式的模型路径`;
            document.getElementById('conv-output').value = '';
        }
        
        async function startConversion() {
            const input = document.getElementById('conv-input').value;
            const output = document.getElementById('conv-output').value;
            const quantize = document.getElementById('conv-quantile').value;
            
            if (!input) {
                showToast('请输入模型路径', 'error');
                return;
            }
            
            showToast('转换功能开发中...', 'info');
            // TODO: 连接到 API
        }
        
        function showQuantizationGuide() {
            document.getElementById('modal-title').textContent = '📊 量化等级说明';
            document.getElementById('modal-body').innerHTML = `
                <table style="width: 100%; border-collapse: collapse;">
                    <tr style="border-bottom: 1px solid var(--border);">
                        <th style="text-align: left; padding: 0.5rem;">等级</th>
                        <th style="text-align: left; padding: 0.5rem;">压缩率</th>
                        <th style="text-align: left; padding: 0.5rem;">推荐度</th>
                    </tr>
                    <tr><td style="padding: 0.5rem;">Q2_K</td><td>~2.5bit</td><td>⭐ 极低</td></tr>
                    <tr><td style="padding: 0.5rem;">Q3_K_M</td><td>~3bit</td><td>⭐⭐ 较低</td></tr>
                    <tr><td style="padding: 0.5rem;">Q4_K_M</td><td>~4.5bit</td><td>⭐⭐⭐⭐ 推荐</td></tr>
                    <tr><td style="padding: 0.5rem;">Q5_K_M</td><td>~5.5bit</td><td>⭐⭐⭐ 高质量</td></tr>
                    <tr><td style="padding: 0.5rem;">Q6_K</td><td>~6bit</td><td>⭐⭐⭐⭐⭐ 极佳</td></tr>
                    <tr><td style="padding: 0.5rem;">Q8_0</td><td>~8bit</td><td>几乎无损</td></tr>
                </table>
            `;
            document.getElementById('modal').classList.add('active');
        }
        
        async function installLlamaCpp() {
            showToast('正在安装 llama.cpp...', 'info');
            // TODO: 连接到 API
        }
        
        // 部署服务
        async function loadDeployOptions() {
            await loadInstalledModels();
            const select = document.getElementById('deploy-model');
            select.innerHTML = '<option value="">-- 选择已安装的模型 --</option>' +
                installedModels.map(m => `<option value="${m.id}">${m.id}</option>`).join('');
        }
        
        async function startServer() {
            const model = document.getElementById('deploy-model').value;
            if (!model) {
                showToast('请先选择一个模型', 'error');
                return;
            }
            
            showToast('正在启动服务...', 'info');
            // TODO: 连接到 API
        }
        
        function stopServer() {
            showToast('服务已停止', 'info');
            serverRunning = false;
        }
        
        // 工具函数
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        function openSettings() {
            showToast('设置功能开发中...', 'info');
        }
    </script>
</body>
</html>
